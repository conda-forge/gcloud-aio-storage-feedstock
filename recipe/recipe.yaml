schema_version: 1

context:
  name: gcloud-aio-storage
  version: 9.6.5

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gcloud_aio_storage-${{ version }}.tar.gz
  sha256: 44a9529e429d7460f1a55b49a0f77906d988ee68483513abb3c0d66dedf43abd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - aiofiles >=0.6.0,<26.0.0
    - gcloud-aio-auth >=5.4.4,<6.0.0
    - cryptography >=3.1.0,<52.0.0
tests:
  - python:
      imports:
        - gcloud.aio.storage
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Python Client for Google Cloud Storage
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/talkiq/gcloud-aio

extra:
  recipe-maintainers:
    - xylar
